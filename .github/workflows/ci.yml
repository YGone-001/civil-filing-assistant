# File: .github/workflows/ci.yml
# Purpose: Minimal CI for the Civil Filing Assistant (Windows is the supported desktop target).
# Encoding: UTF-8
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows (primary)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q main.py models presenters utils views drafts test_generator.py tools tests

      - name: Duplicate test check
        run: python tools/check_duplicate_tests.py

      - name: Template governance check
        run: python tools/check_template_governance.py

      - name: Commit message policy
        shell: pwsh
        run: |
          $base = ""
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
          } else {
            $base = "${{ github.event.before }}"
          }
          if ([string]::IsNullOrWhiteSpace($base) -or $base -eq "0000000000000000000000000000000000000000") {
            # Initial commit or no prior commit: validate HEAD only.
            python tools/check_commit_message.py --rev HEAD
          } else {
            python tools/check_commit_message.py --range "$base..HEAD"
          }

      # A failing test must be identifiable from the run's annotations, not only
      # from the (permission-protected) step log: the JUnit report is turned
      # into one ::error annotation per failing test.
      - name: Pytest suite
        shell: pwsh
        run: |
          python -m pytest -q --junitxml=pytest-report.xml
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path pytest-report.xml)) {
            python -c "import xml.etree.ElementTree as ET; root = ET.parse('pytest-report.xml').getroot(); [print('::error title=' + (case.get('classname') or '?') + '::' + (case.get('name') or '?')) for case in root.iter('testcase') if case.find('failure') is not None or case.find('error') is not None]"
          }
          exit $code

      - name: Smoke test
        run: python test_generator.py
