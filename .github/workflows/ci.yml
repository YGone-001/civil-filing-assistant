# File: .github/workflows/ci.yml
# Purpose: Minimal CI for the Civil Filing Assistant (Windows primary, Linux offscreen optional).
# Encoding: UTF-8
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows (primary)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q main.py models presenters utils views test_generator.py

      - name: Commit message policy
        run: python tools/check_commit_message.py --rev HEAD

      - name: Pytest suite
        run: python -m pytest -q

      - name: Smoke test
        run: python test_generator.py

  linux-offscreen:
    name: Linux offscreen (supplementary)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt offscreen runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libegl1 libgl1 libglib2.0-0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q main.py models presenters utils views test_generator.py

      - name: Pytest suite
        run: python -m pytest -q
